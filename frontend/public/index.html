<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'
        integrity='sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH' crossorigin='anonymous'>
    <link rel="stylesheet" href="../src/styles/index.css">
</head>

<body>

    <div class="container d-flex align-items-center justify-content-center">
        <img src="../src/img/TEA-removebg-preview.png" alt="Logo" style="max-width: 40%; height: auto; margin-right: 20px;"> <!-- Imagen al lado -->
        <div class="col-xs-10 col-md-6 col-sm-9 col-lg-5">
            <div class="card shadow-sm custom-card">
                <div class="card-body">
                    <h3 class="text-center mb-4">Inicio de Sesión</h3>
                    <form id="login-form">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="username" placeholder="Usuario" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 custom-btn">Ingresar</button>
                        <p class="text-center mt-3">¿No tienes cuenta? <a href="./register.html" class="register-link">Regístrate</a></p>
                    </form>
                    <p id="message" class="text-danger mt-3"></p>
                </div>
            </div>
        </div>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js'
        integrity='sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r'
        crossorigin='anonymous'></script>
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js'
        integrity='sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy'
        crossorigin='anonymous'></script>
    <script src="../src/script/index.js"></script>
</body>

</html>
